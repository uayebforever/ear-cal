[project]
name = "earcal"
version = "0.1.0"
description = "Adaptive personal hearing-loudness calibration across frequency bands"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.25",
    "sounddevice>=0.4",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
earcal = "earcal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["earcal*"]
